<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK Prover</title>
</head>
<body>
    <h3>ZK Proof Generator</h3>
    <div id="status">Initializing...</div>

    <script>
        console.log('=== ZKProver HTML loaded ===');

        // Global state
        let wasmBuffer = null;
        let isInitialized = false;
        let initStartTime = Date.now();

        // Check Android interface
        console.log('Android interface available:', typeof Android !== 'undefined');

        // Load witness calculator first
        console.log('Loading witness_calculator.js...');
        const witnessScript = document.createElement('script');
        witnessScript.src = 'zkp/witness_calculator.js';
        witnessScript.onerror = function() {
            console.error('Failed to load witness_calculator.js');
            document.getElementById('status').textContent = 'Failed to load witness calculator';
            if (typeof Android !== 'undefined') {
                Android.onWasmLoaded(false);
            }
        };
        witnessScript.onload = function() {
            console.log('witness_calculator.js loaded successfully');
            console.log('WitnessCalculator available:', typeof WitnessCalculator !== 'undefined');

            // After witness calculator loads, load SnarkJS (optional for now)
            // Then initialize WASM
            setTimeout(initializeWasm, 100);
        };
        document.head.appendChild(witnessScript);

        // Initialize WASM file
        async function initializeWasm() {
            try {
                console.log('=== Starting WASM initialization ===');
                console.log('Fetching WASM from: zkp/age_check.wasm');

                // Use XMLHttpRequest instead of fetch for file:// protocol on Android
                wasmBuffer = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', 'zkp/age_check.wasm', true);
                    xhr.responseType = 'arraybuffer';

                    xhr.onload = function() {
                        if (xhr.status === 200 || xhr.status === 0) {
                            console.log('WASM loaded, size:', xhr.response.byteLength, 'bytes');
                            resolve(xhr.response);
                        } else {
                            reject(new Error(`HTTP ${xhr.status}: ${xhr.statusText}`));
                        }
                    };

                    xhr.onerror = function() {
                        reject(new Error('Failed to load WASM file'));
                    };

                    xhr.send();
                });

                console.log('WASM ArrayBuffer created, byteLength:', wasmBuffer.byteLength);

                // Verify WitnessCalculator is available
                if (typeof WitnessCalculator === 'undefined') {
                    throw new Error('WitnessCalculator not loaded');
                }

                document.getElementById('status').textContent = 'WASM loaded successfully';
                isInitialized = true;

                const initTime = Date.now() - initStartTime;
                console.log(`=== WASM initialized successfully in ${initTime}ms ===`);

                // Notify Android that initialization is complete
                if (typeof Android !== 'undefined') {
                    console.log('Calling Android.onWasmLoaded(true)');
                    Android.onWasmLoaded(true);
                } else {
                    console.warn('Android interface not found!');
                }
            } catch (error) {
                console.error('=== WASM initialization failed ===');
                console.error('Error type:', error.constructor.name);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);

                document.getElementById('status').textContent = 'Failed: ' + error.message;

                if (typeof Android !== 'undefined') {
                    console.log('Calling Android.onWasmLoaded(false)');
                    Android.onWasmLoaded(false);
                } else {
                    console.error('Cannot notify Android - interface not available');
                }
            }
        }

        // Generate ZK proof function called from Kotlin
        async function generateProof(birthYear, minAge, currentYear) {
            try {
                console.log('=== Starting proof generation ===');
                console.log('Inputs:', { birthYear, minAge, currentYear });

                if (!isInitialized) {
                    throw new Error('WASM not initialized');
                }

                // Create input for circuit
                const input = {
                    birthYear: parseInt(birthYear),
                    minAge: parseInt(minAge),
                    currentYear: parseInt(currentYear)
                };

                console.log('Circuit input:', input);

                // Calculate witness
                console.log('Creating witness calculator...');
                const witnessCalc = await WitnessCalculator(wasmBuffer);
                console.log('Calculating witness...');
                const witness = await witnessCalc.calculateWitness(input, false);
                console.log('Witness calculated successfully');

                // Mock proof structure (since we don't have .zkey yet)
                const mockProof = {
                    pi_a: ["1", "2", "1"],
                    pi_b: [["1", "2"], ["1", "2"], ["1", "2"]],
                    pi_c: ["1", "2", "1"],
                    protocol: "groth16"
                };

                // Calculate if age requirement is met
                const age = currentYear - birthYear;
                const isOldEnough = age >= minAge ? 1 : 0;

                const publicSignals = [
                    isOldEnough.toString(),
                    minAge.toString(),
                    currentYear.toString()
                ];

                const result = {
                    proof: mockProof,
                    publicSignals: publicSignals
                };

                console.log('Proof generated successfully:', result);

                // Return JSON to Android
                const jsonResult = JSON.stringify(result);
                if (typeof Android !== 'undefined') {
                    Android.onProofGenerated(jsonResult);
                }

                return jsonResult;

            } catch (error) {
                console.error('=== Proof generation failed ===');
                console.error('Error:', error.message);
                console.error('Stack:', error.stack);

                const errorResult = {
                    error: error.message || 'Unknown error during proof generation'
                };

                const jsonResult = JSON.stringify(errorResult);
                if (typeof Android !== 'undefined') {
                    Android.onProofGenerated(jsonResult);
                }

                return jsonResult;
            }
        }

        // Make generateProof available globally
        window.generateProof = generateProof;

        console.log('=== Setup complete, waiting for scripts to load ===');
    </script>
</body>
</html>
